# The GroupName here is used to identify your company or business unit that
# created this webhook.
# For example, this may be "acme.mycompany.com".
# This name will need to be referenced in each Issuer's `webhook` stanza to
# inform cert-manager of where to send ChallengePayload resources in order to
# solve the DNS01 challenge.
# This group name should be **unique**, hence using your own company's domain
# here is recommended.
groupName: acme.namecheap.com

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

image:
  repository: kelvie/cert-manager-webhook-namecheap
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# The (secure) port our app binds to
containerPort: 8443

service:
  type: ClusterIP
  port: 443

# Set custom DNS resolvers for the webhook. This is useful if using coredns's host plugin to resolve
# hostnames covered by any certificates you need to issue.
dns: {}
#  dnsPolicy: "None"
#  dnsConfig:
#    nameservers:
#      - 9.9.9.9
#      - 1.1.1.1
#      - 9.9.9.10
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

securityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}

priorityClassName: ""
